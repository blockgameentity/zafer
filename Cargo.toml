[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# Fixtures are standalone crates built on demand by integration tests.
exclude = ["tests/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Internal crates
victory-core = { path = "crates/victory-core" }
victory-pe = { path = "crates/victory-pe" }
victory-loader = { path = "crates/victory-loader" }
victory-hle = { path = "crates/victory-hle" }
victory-gpu = { path = "crates/victory-gpu" }
victory-shader = { path = "crates/victory-shader" }
victory-vulkan = { path = "crates/victory-vulkan" }
victory-spirv = { path = "crates/victory-spirv" }
victory-spirv-emit = { path = "crates/victory-spirv-emit" }
victory-formats = { path = "crates/victory-formats" }
victory-pipeline = { path = "crates/victory-pipeline" }
victory-game = { path = "crates/victory-game" }
victory-windows = { path = "crates/victory-windows" }

# External crates
anyhow = "1.0.104"
# The Wayland client the window layer speaks on Linux (native, no SDL for
# the window): `system` so `wl_display` is reachable for `VkSurfaceKHR`.
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client"] }
# Pinned to a commit, not the crates.io release: master tracks Vulkan
# 1.4.352 (the published 0.38 is still on 1.3.281 headers), and a `rev`
# cannot change under us the way a branch can.
ash = { git = "https://github.com/ash-rs/ash", rev = "80e5856982af6651d56337f9a10e46308145c2d2", default-features = false, features = ["loaded", "debug"] }
thiserror = "2.0.21"
clap = { version = "4.6.9", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
object = { version = "0.41.0", default-features = false, features = ["read_core", "pe", "coff", "archive", "std"] }
windows-sys = "0.61.2"
libloading = "0.8"
# The native Linux runtime's system calls.
libc = "0.2.191"
windows = "0.62.2"
windows-core = "0.62.2"
blake3 = "1.8.7"
# Table-driven CRC-32 with an SSSE3 path: 256x the bit-at-a-time loop the
# frame capture used to hash chunks with (see `benches/crc.rs`).
crc32fast = "1.5.6"
# Checked reinterpretation of byte slices as typed ones: replaces the
# `unsafe { from_raw_parts }` calls with a length-and-alignment check.
bytemuck = { version = "1", features = ["derive"] }
# Itanium-ABI demangling, so a report about an unsupported instruction
# can name an exported symbol the way a human reads it.
cpp_demangle = "0.5"
# The WHATWG reference implementation of the legacy code pages, so a title
# on a Japanese/Korean/Chinese code page converts instead of being refused.
encoding_rs = "0.8"
memchr = "2.8.3"
miniz_oxide = "0.9.1"
walkdir = "2.5.1"
# Parallel directory walking (the one `dua` uses) and a faster mutex: the
# precompiler's producer walks 200 GB of title and its pool contends on a
# seen-set and a queue, both of which walkdir and std::sync make slow.
parking_lot = "0.12"
dua-core = "6.1.0"
dashmap = "6.2.1"
crossbeam-channel = "0.5"
tempfile = "3.27.0"
# Opus decoding for the console's audio decoder (BSD-3-Clause, pure Rust).
opus-pure = "0.2.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.dev.package."*"]
# Dependencies (hashing, parsing) are hot paths when chewing through
# gigabytes of game data; keep them fast even in debug builds.
opt-level = 2

[profile.release]
debug = "line-tables-only"

# The development build: release code generation plus the `diagnostics`
# feature (`cargo build --profile diag -p victory --features diagnostics`),
# kept in its own folder so it does not evict the plain release build.
[profile.diag]
inherits = "release"
