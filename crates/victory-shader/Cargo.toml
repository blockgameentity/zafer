[package]
name = "victory-shader"
description = "Xbox shader containers (DXBC/DXIL + precompiled GFX10) to host shaders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
miniz_oxide.workspace = true

[features]
# Host D3D12 pipeline checks (`emit::host`).
host = ["dep:windows", "dep:victory-windows"]
# Debugging switches (emitted-module dumps and the like).
diagnostics = []

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader"] }
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

# On Linux the host D3D12 is vkd3d-proton (`hostlib`), with the same
# bindings (named `windows` in `lib.rs`).
[target.'cfg(not(windows))'.dependencies]
victory-windows = { workspace = true, optional = true }
libc.workspace = true

[target.'cfg(not(windows))'.dev-dependencies]
victory-windows.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true
